# This workflow is used for FBGEMM GPU/GenAI ROCm CI as well as nightly builds
# of FBGEMM GPU/GenAI ROCm against PyTorch-ROCm Nightly.
name: FBGEMM GPU/GenAI ROCm CI

on:
  # PR Trigger (enabled for regression checks and debugging)
  #
  pull_request:
    branches:
      - main

  # Push Trigger (enable to catch errors coming out of multiple merges)
  #
  push:
    branches:
      - main

  # Cron Trigger (UTC)
  #
  # Based on the Conda page for PyTorch-nightly, the GPU nightly releases appear
  # around 02:30 PST every day (roughly 2 hours after the CPU releases)
  #
  schedule:
    - cron:  '45 12 * * *'

  # Manual Trigger
  #
  workflow_dispatch:
    inputs:
      pytorch-channel-version:
        description: Package Channel + Version to Use for PyTorch Installation, in `<channel>[/<version>]` Format
        type: string
        required: false
        default: ""

concurrency:
  # PRs: cancel previous runs when a new commit is pushed.
  # Push/main: group by sha so a new merge does not cancel an in-flight run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-sll-changes:
    if: ${{ github.repository_owner == 'pytorch' }}
    runs-on: ubuntu-latest
    outputs:
      run-sll-tests: ${{ steps.changes.outputs.run-sll-tests }}
    steps:
    - name: Checkout the Repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0

    - name: Detect SLL Changes
      id: changes
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [[ "$EVENT_NAME" != "pull_request" ]]; then
          run_sll_tests=true
        else
          git diff --quiet HEAD^1 HEAD^2 -- fbgemm_gpu/sll fbgemm_gpu/test/sll && diff_status=0 || diff_status=$?
          if [[ "$diff_status" == 0 ]]; then
            run_sll_tests=false
          elif [[ "$diff_status" == 1 ]]; then
            run_sll_tests=true
          else
            exit "$diff_status"
          fi
        fi
        echo "run-sll-tests=${run_sll_tests}" >> "$GITHUB_OUTPUT"

  generate-build-matrix:
    if: ${{ github.repository_owner == 'pytorch' }}
    uses: ./.github/workflows/_fbgemm_gpu_generate_ci_matrix.yml
    with:
      repo-owner: ${{ github.repository_owner }}
      repo-ref: ${{ (github.event_name == 'schedule' && 'nightly') || github.ref }}
      targets: default,genai
      variant: rocm
      jobtype: build

  build:
    needs: generate-build-matrix
    uses: ./.github/workflows/_fbgemm_gpu_rocm_build.yml
    with:
      matrix: ${{ needs.generate-build-matrix.outputs.matrix }}
      repo-ref: ${{ (github.event_name == 'schedule' && 'nightly') || github.ref }}
      pytorch-channel-version: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.pytorch-channel-version) || 'nightly' }}

  generate-test-matrix:
    needs: build
    uses: ./.github/workflows/_fbgemm_gpu_generate_ci_matrix.yml
    with:
      repo-owner: ${{ github.repository_owner }}
      repo-ref: ${{ (github.event_name == 'schedule' && 'nightly') || github.ref }}
      targets: default,genai
      variant: rocm
      jobtype: test

  test:
    needs: [detect-sll-changes, generate-test-matrix]
    uses: ./.github/workflows/_fbgemm_gpu_rocm_test.yml
    with:
      matrix: ${{ needs.generate-test-matrix.outputs.matrix }}
      repo-ref: ${{ (github.event_name == 'schedule' && 'nightly') || github.ref }}
      pytorch-channel-version: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.pytorch-channel-version) || 'nightly' }}
      run-sll-tests: ${{ needs.detect-sll-changes.outputs.run-sll-tests != 'false' }}
      extra-env: >-
        {
          "ENFORCE_ROCM_DEVICE": 1
        }
