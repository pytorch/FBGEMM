# This callable workflow is used for testing or benchmarking FBGEMM GPU/GenAI
# ROCm wheels on GPU.
name: FBGEMM GPU/GenAI ROCm Test

on:
  workflow_call:
    inputs:
      matrix:
        description: 'Test matrix in `{"include": [...]}` form, where each row specifies its `rocm-version` (or "latest")'
        type: string
        required: true
      repo-ref:
        description: Repository ref/sha
        type: string
        required: true
      extra-env:
        description: 'JSON string of extra environment variables, e.g. {"KEY1": "value1", "KEY2": "value2"}'
        type: string
        required: false
        default: '{}'
      pytorch-channel-version:
        description: Package Channel + Version to Use for PyTorch Installation, in `<channel>[/<version>]` Format
        type: string
        required: false
        default: ""
      fbgemm-channel-version:
        description: PIP channel + version to install FBGEMM (if not specified, the GitHub artifact will be used instead)
        type: string
        required: false
        default: ""
      run-target:
        description: Run target (test, benchmark)
        type: string
        required: false
        default: test

jobs:
  # Add the container image that provides each row's ROCm version
  resolve_container_images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
    - name: Checkout the Repository
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.repo-ref }}

    - name: Resolve Container Images
      id: resolve
      env:
        MATRIX: ${{ inputs.matrix }}
      run: |
        matrix=$(python3 .github/scripts/resolve_rocm_container_images.py)
        echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  # Download the built artifact from GHA (or install from PIP) and test on GPU
  test_artifact:
    needs: resolve_container_images
    runs-on: ${{ matrix.host-machine.instance }}
    container:
      image: ${{ matrix.container-image }}
      options: --user root --device=/dev/kfd --device=/dev/dri --ipc=host --shm-size 16G --group-add video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    env:
      PRELUDE: .github/scripts/setup_env.bash
      BUILD_ENV: build_binary
      BUILD_TARGET: ${{ matrix.build-target }}
      BUILD_VARIANT: rocm
      BUILD_ROCM_VERSION: ${{ matrix.rocm-version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve_container_images.outputs.matrix) }}

    steps:
    - name: Setup Build Container
      run: |
        apt update -y
        apt install -y git jq pciutils sudo wget
        git config --global --add safe.directory '*'

    - name: Merge Extra Environment Variables
      run: |
        ENV_JSON='${{ inputs.extra-env }}'

        # Validate JSON
        if ! echo "$ENV_JSON" | jq empty; then
          echo "❌ Invalid JSON provided: $ENV_JSON" >&2
          exit 1
        fi

        # Merge key-value pairs into GITHUB_ENV
        echo "$ENV_JSON" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

        unset ENV_JSON

    - name: Checkout the Repository
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.repo-ref }}

    - name: Display System Info
      run: . $PRELUDE; print_system_info

    - name: Display GPU Info
      run: . $PRELUDE; print_gpu_info

    - name: Free Disk Space
      run: . $PRELUDE; free_disk_space

    - name: Setup Miniconda
      run: . $PRELUDE; setup_miniconda $HOME/miniconda

    - name: Create Conda Environment
      run: . $PRELUDE; create_conda_environment $BUILD_ENV ${{ matrix.python-version }}

    - name: Install C/C++ Compilers
      # NOTE: Need to install compilers to set up libomp for the clang case
      run: . $PRELUDE; install_cxx_compiler $BUILD_ENV ${{ matrix.compiler || 'gcc' }}

    - name: Install Build Tools
      # NOTE: Need to install build tools to set up libtbb
      run: . $PRELUDE; install_build_tools $BUILD_ENV

    # ROCm itself is provided by the container image
    - name: Install ROCm AMD-SMI
      run: . $PRELUDE; install_rocm_amdsmi_ubuntu $BUILD_ENV

    - name: Install PyTorch-ROCm (${{ inputs.pytorch-channel-version }})
      run: . $PRELUDE; install_pytorch_pip $BUILD_ENV ${{ inputs.pytorch-channel-version }} rocm/${{ matrix.rocm-version }}

    - name: Collect PyTorch Environment Info
      if: ${{ success() || failure() }}
      run: if . $PRELUDE && which conda; then collect_pytorch_env_info $BUILD_ENV; fi

    # Only install FBGEMM's requirements, so that PyTorch's own Triton is used
    - name: Install FBGEMM_GPU dependencies (pip)
      run: . $PRELUDE; cd fbgemm_gpu; install_fbgemm_gpu_deps $BUILD_ENV

    - name: Download Wheel Artifact from GHA
      if: ${{ inputs.fbgemm-channel-version == '' }}
      uses: actions/download-artifact@v7
      with:
        name: fbgemm_${{ matrix.build-target }}_${{ matrix.host-machine.arch }}_${{ matrix.compiler }}_py${{ matrix.python-version }}_rocm${{ matrix.rocm-version }}.whl

    - name: Install FBGEMM_GPU (local wheel)
      if: ${{ inputs.fbgemm-channel-version == '' }}
      run: . $PRELUDE; install_fbgemm_gpu_wheel $BUILD_ENV *.whl

    - name: Install FBGEMM_GPU (pip)
      if: ${{ inputs.fbgemm-channel-version != '' }}
      run: . $PRELUDE; install_fbgemm_gpu_pip $BUILD_ENV ${{ inputs.fbgemm-channel-version }} rocm/${{ matrix.rocm-version }}

    - name: Test with PyTest
      if: ${{ inputs.run-target == 'test' }}
      timeout-minutes: 90
      run: . $PRELUDE; test_all_fbgemm_gpu_modules $BUILD_ENV

    - name: Set Up for FBGEMM_GPU Benchmark
      if: ${{ inputs.run-target == 'benchmark' }}
      run: . $PRELUDE; setup_fbgemm_gpu_bench $BUILD_ENV

    - name: Run FBGEMM_GPU Benchmark
      if: ${{ inputs.run-target == 'benchmark' }}
      timeout-minutes: 40
      run: . $PRELUDE; run_tbe_microbench $BUILD_ENV

    - name: Upload Benchmark Traces as GHA Artifacts
      if: ${{ inputs.run-target == 'benchmark' }}
      uses: actions/upload-artifact@v6
      with:
        name: fbgemm_gpu_traces_${{ matrix.host-machine.arch }}_${{ matrix.compiler }}_py${{ matrix.python-version }}_rocm${{ matrix.rocm-version }}.zip
        path: fbgemm_gpu/bench/*.json
        if-no-files-found: error
