name: Build FBGEMM GenAI x86 Linux Wheels

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
    tags:
      # Release candidate tag look like: v1.11.0-rc1
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  generate-matrix:
    if: ${{ github.repository_owner == 'pytorch' }}
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      runner-fleet: osdc
      with-cuda: enable
      with-rocm: enable
      with-cpu: disable

  filter-matrix:
    if: ${{ github.repository_owner == 'pytorch' }}
    needs: generate-matrix
    runs-on: linux.24_04.4x
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
    - uses: actions/setup-python@v6
    - name: Checkout FBGEMM repository
      uses: actions/checkout@v6
      with:
        repository: pytorch/fbgemm
    - name: Filter Generated Built Matrix
      id: filter
      env:
        MAT: ${{ needs.generate-matrix.outputs.matrix }}
      # Nova Coordinate Filters:
      # cuda/11.8: No longer supported in FBGEMM
      # cuda/12.9: No longer supported in PyTorch
      # cuda 13.2 (cu132), 13.4 (cu134): not supported by FBGEMM yet; validate step
      #   fails with "Unknown distribution". 13.4 is still on toolkit 13.4.0rc1
      #   (not GA). Drop until each is supported.
      # rocm/3.13t: causes segfaults at runtime
      #
      # Nova Runner Overrides:
      # cuda: the Nova default is the 41Gi 1-GPU pod, FBGEMM's CUDA *test*
      #   machine. Nova builds and tests in one job, and the cutlass kernels do
      #   not fit there, so both paths build on a 104Gi 1-GPU L4 pod instead --
      #   mt-rel-l-x86aavx2-29-113-l4 for release refs, which keeps them on a
      #   release-class runner, and mt-l-x86aavx2-29-113-l4 otherwise.
      #   The pod has to have a GPU even though the build never uses one:
      #   test-infra runs the job container with `--gpus all` for every cuda
      #   row, so a CPU-only runner cannot start it. One is enough.
      #   The refs below mirror RELEASE_REF_PREFIXES in test-infra's
      #   generate_binary_build_matrix.
      run: |
        set -ex
        pwd
        ls

        runner_args=()
        case "${GITHUB_REF}" in
          refs/heads/main|refs/heads/nightly|refs/heads/release/*|refs/tags/v*)
            runner_args=(--runner 'gpu_arch_type:cuda=mt-rel-l-x86aavx2-29-113-l4') ;;
          *)
            runner_args=(--runner 'gpu_arch_type:cuda=mt-l-x86aavx2-29-113-l4') ;;
        esac

        MATRIX_BLOB="$( python .github/scripts/filter_nova_matrix.py --filter gpu_arch_version:11.8 --filter 'gpu_arch_type:rocm;python_version:3.13t,3.14t' --filter 'gpu_arch_version:13.2,13.4' "${runner_args[@]}" )"
        echo "${MATRIX_BLOB}"
        echo "matrix=${MATRIX_BLOB}" >> "${GITHUB_OUTPUT}"

  build:
    if: ${{ github.repository_owner == 'pytorch' }}
    needs: filter-matrix
    name: pytorch/FBGEMM
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: pytorch/FBGEMM
      ref: ""
      pre-script: ../.github/scripts/nova_prescript.bash
      post-script: ../.github/scripts/nova_postscript.bash
      smoke-test-script: ""
      env-var-script: .github/scripts/nova_dir.bash
      package-name: fbgemm_gpu
      build-target: genai
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      build-matrix: ${{ needs.filter-matrix.outputs.matrix }}
      trigger-event: ${{ github.event_name }}
      # Based on current measurements for CUDA 12.9 workflows, builds take
      # 2.5 hours while tests take 0.1 hours
      timeout: 210

  # Uploads the wheels to R2 from a job of its own: R2 credentials come from the
  # pytorchbot-env environment, which only nightly and release refs can use. A
  # reusable workflow cannot read environment secrets, so build_wheels_linux.yml
  # does not get them.
  upload-r2:
    if: ${{ always() && needs.filter-matrix.result == 'success' && github.repository == 'pytorch/FBGEMM' && (github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/nightly'))) }}
    needs: [filter-matrix, build]
    runs-on: ubuntu-22.04
    environment: pytorchbot-env
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.filter-matrix.outputs.matrix) }}
    name: upload-r2-${{ matrix.build_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra

      - uses: ./test-infra/.github/actions/set-channel

      - uses: ./test-infra/.github/actions/setup-binary-upload
        with:
          repository: pytorch/FBGEMM
          ref: ""
          python-version: ${{ matrix.python_version }}
          cuda-version: ${{ matrix.desired_cuda }}
          arch: x86_64
          upload-to-base-bucket: ${{ matrix.upload_to_base_bucket }}

      - name: Download the artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: pytorch/FBGEMM/dist/

      - name: Upload package to R2
        shell: bash
        working-directory: pytorch/FBGEMM
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -ex
          if [[ -z "${R2_ACCOUNT_ID}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::R2 secrets are missing from the pytorchbot-env environment"
            exit 1
          fi

          # shellcheck disable=SC1090
          source "${BUILD_ENV_FILE}"

          pip install awscli==1.32.18

          PYTORCH_S3_BUCKET_PATH=${PYTORCH_S3_BUCKET_PATH/"s3://pytorch"/"s3://pytorch-downloads"}
          for pkg in dist/*; do
            shm_id=$(sha256sum "${pkg}" | awk '{print $1}')
            aws s3 cp "$pkg" "${PYTORCH_S3_BUCKET_PATH}" \
              --metadata "checksum-sha256=${shm_id}" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          done
