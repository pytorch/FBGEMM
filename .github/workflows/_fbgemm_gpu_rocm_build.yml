# This callable workflow is used for building FBGEMM GPU/GenAI ROCm wheels.
name: FBGEMM GPU/GenAI ROCm Build

on:
  workflow_call:
    inputs:
      matrix:
        description: 'Build matrix in `{"include": [...]}` form, where each row specifies its `rocm-version` (or "latest")'
        type: string
        required: true
      repo-ref:
        description: Repository ref/sha
        type: string
        required: true
      extra-env:
        description: 'JSON string of extra environment variables, e.g. {"KEY1": "value1", "KEY2": "value2"}'
        type: string
        required: false
        default: '{}'
      pytorch-channel-version:
        description: Package Channel + Version to Use for PyTorch Installation, in `<channel>[/<version>]` Format
        type: string
        required: false
        default: ""

jobs:
  # Add the container image that provides each row's ROCm version
  resolve_container_images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
    - name: Checkout the Repository
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.repo-ref }}

    - name: Resolve Container Images
      id: resolve
      env:
        MATRIX: ${{ inputs.matrix }}
      run: |
        matrix=$(python3 .github/scripts/resolve_rocm_container_images.py)
        echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  # Build on CPU hosts and upload to GHA
  build_artifact:
    needs: resolve_container_images
    runs-on: ${{ matrix.host-machine.instance }}
    container:
      image: ${{ matrix.container-image }}
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      PRELUDE: .github/scripts/setup_env.bash
      BUILD_ENV: build_binary
      BUILD_TARGET: ${{ matrix.build-target }}
      BUILD_VARIANT: rocm
      BUILD_ROCM_VERSION: ${{ matrix.rocm-version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve_container_images.outputs.matrix) }}

    steps:
    - name: Setup Build Container
      run: |
        apt update -y
        apt install -y binutils git jq pciutils sudo wget
        git config --global --add safe.directory '*'

    - name: Merge Extra Environment Variables
      run: |
        ENV_JSON='${{ inputs.extra-env }}'

        # Validate JSON
        if ! echo "$ENV_JSON" | jq empty; then
          echo "❌ Invalid JSON provided: $ENV_JSON" >&2
          exit 1
        fi

        # Merge key-value pairs into GITHUB_ENV
        echo "$ENV_JSON" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

        unset ENV_JSON

    - name: Checkout the Repository
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.repo-ref }}

    - name: Display System Info
      run: . $PRELUDE; print_system_info

    - name: Display GPU Info
      run: . $PRELUDE; print_gpu_info

    - name: Free Disk Space
      run: . $PRELUDE; free_disk_space

    - name: Setup Miniconda
      run: . $PRELUDE; setup_miniconda $HOME/miniconda

    - name: Create Conda Environment
      run: . $PRELUDE; create_conda_environment $BUILD_ENV ${{ matrix.python-version }}

    - name: Install C/C++ Compilers
      run: . $PRELUDE; install_cxx_compiler $BUILD_ENV ${{ matrix.compiler }}

    - name: Install Build Tools
      run: . $PRELUDE; install_build_tools $BUILD_ENV

    # ROCm itself is provided by the container image
    - name: Install ROCm AMD-SMI
      run: . $PRELUDE; install_rocm_amdsmi_ubuntu $BUILD_ENV

    - name: Install PyTorch-ROCm (${{ inputs.pytorch-channel-version }})
      run: . $PRELUDE; install_pytorch_pip $BUILD_ENV ${{ inputs.pytorch-channel-version }} rocm/${{ matrix.rocm-version }}

    - name: Collect PyTorch Environment Info
      if: ${{ success() || failure() }}
      run: if . $PRELUDE && which conda; then collect_pytorch_env_info $BUILD_ENV; fi

    - name: Prepare FBGEMM_GPU Build
      run: . $PRELUDE; cd fbgemm_gpu; prepare_fbgemm_gpu_build $BUILD_ENV

    - name: Build FBGEMM_GPU Wheel
      run: |
        . $PRELUDE
        cd fbgemm_gpu

        # Extract channel from channel/version string
        PYTORCH_CHANNEL_VERSION="${{ inputs.pytorch-channel-version }}"
        PYTORCH_CHANNEL_ONLY="${PYTORCH_CHANNEL_VERSION%%/*}"

        build_fbgemm_gpu_package $BUILD_ENV "$PYTORCH_CHANNEL_ONLY" ${{ matrix.build-target }}/rocm

    - name: Upload Built Wheel as GHA Artifact
      uses: actions/upload-artifact@v6
      with:
        name: fbgemm_${{ matrix.build-target }}_${{ matrix.host-machine.arch }}_${{ matrix.compiler }}_py${{ matrix.python-version }}_rocm${{ matrix.rocm-version }}.whl
        path: fbgemm_gpu/dist/*.whl
        if-no-files-found: error
