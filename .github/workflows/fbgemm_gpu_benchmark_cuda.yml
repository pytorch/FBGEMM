# This workflow is used for FBGEMM_GPU-CUDA Benchmarking
name: FBGEMM_GPU-CUDA Benchmark

on:
  # PR Trigger (enabled for regression checks and debugging)
  #
  pull_request:
    branches:
      - main

  # Manual Trigger
  #
  workflow_dispatch:
    inputs:
      pytorch-channel-version:
        description: Package Channel + Version to Use for PyTorch Installation, in `<channel>[/<version>]` Format
        type: string
        required: false
        default: ""

concurrency:
  group: fbgemm-health-8a340378e496adb98bc6a7df5bf2da20-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ false }}
    uses: ./.github/workflows/_fbgemm_gpu_cuda_build.yml
    with:
      matrix: >-
        {
          "build-target": [ "default" ],
          "host-machine": [
            { "arch": "x86", "instance": "mt-l-x86iavx512-94-192" },
          ],
          "python-version": [ "3.14" ],
          "cuda-version": [ "13.0.2" ],
          "compiler": [ "gcc" ],
        }
      repo-ref: ${{ github.ref }}
      pytorch-channel-version: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.pytorch-channel-version) || 'nightly' }}

  benchmark:
    if: ${{ false }}
    needs: build
    uses: ./.github/workflows/_fbgemm_gpu_cuda_test.yml
    with:
      matrix: >-
        {
          "build-target": [ "default" ],
          "host-machine": [
            { "arch": "x86", "instance": "mt-l-x86aavx2-11-41-a10g" },
          ],
          "python-version": [ "3.14" ],
          "cuda-version": [ "13.0.2" ],
          "compiler": [ "gcc" ],
        }
      repo-ref: ${{ github.ref }}
      pytorch-channel-version: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.pytorch-channel-version) || 'nightly' }}
      run-target: benchmark
      extra-env: >-
        {
          "ENFORCE_CUDA_DEVICE": 1
        }
