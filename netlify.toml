[build]
  base = "fbgemm_gpu/docs"
  # Audit-head-only: do not start a build if this file is honored.
  ignore = "/bin/true"

[context.deploy-preview]
  publish = "build/html"
  # Fixed cheap fallback if the selected provider skips the ignore command.
  # Whether the provider selects this PR-head configuration is still unproved.
  command = "printf '%s\n' 'Storage health audit: preview build disabled.'"
